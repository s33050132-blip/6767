<script>
    for (let i = 0; i <= 9; i++) {
        for (let j = 0; j <= i ; j++) {
            document.write(i + " * " + j + " = " + (i * j) + "&nbsp;&nbsp;&nbsp;");
        }
        document.write("<br>");
    }
</script>

<script>
    document.write("<table align='center'>");
    for (let i = 0; i <= 9; i++) {
        document.write("<tr>");
        for (let j = 0; j <= i ; j++) {
            document.write("<td>");
            document.write(i + " * " + j + " = " + (i * j) + "&nbsp;&nbsp;&nbsp;");
            document.write("</td>");
        }
        document.write("</tr>");
    }
    document.write("</table>");
</script>

<style>
    /* 每個儲存格的style樣式：方框 + 方框線寬度為1px + 方框線為實線 */
    td {
         border: 1px solid;
    }
</style>
